# Local development stack. TRUSTED USE ONLY — see docs/security/compile-sandbox.md.
# Run from the repo root:  pnpm stack:up   (== docker compose -f infra/compose/docker-compose.yml --env-file .env up --build -d --wait)
name: latex-cloud

x-app-env: &app-env
  NODE_ENV: development
  DATABASE_URL: postgres://${POSTGRES_USER:-latex_cloud}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-latex_cloud}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://storage:9000
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-latex-cloud}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
  S3_FORCE_PATH_STYLE: 'true'
  WEB_ORIGIN: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
  API_PORT: '4000'
  # Shared by the API (mints WebSocket tokens) and the collab server (verifies them).
  COLLAB_TOKEN_SECRET: ${COLLAB_TOKEN_SECRET:-latex-cloud-dev-only-collab-secret-change-me}
  # Browsers connect to the collab server directly.
  COLLAB_PUBLIC_URL: ws://localhost:${COLLAB_PORT:-4100}/collab

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-latex_cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-latex_cloud}
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. SeaweedFS (Apache-2.0, on Docker Hub, amd64 +
  # arm64) replaces MinIO, whose public images are no longer available.
  # S3 authentication uses S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY from .env.
  # To use MinIO instead (if you have access to its images), add
  # -f infra/compose/storage-minio.yml.
  storage:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"latex-cloud","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=64 -volume.max=100
    ports:
      - '127.0.0.1:${STORAGE_PORT:-9000}:9000'
    volumes: [storage-data:/data]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 9000',
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: migrations, dev seed, bucket. API starts only after it succeeds.
  migrate:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    image: latex-cloud/api:dev
    environment:
      <<: *app-env
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-latex-cloud-dev-password}
    command:
      [
        'sh',
        '-c',
        'node dist/database/migrate.js && node dist/database/seed.js && node dist/storage/ensure-bucket.js',
      ]
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_healthy }
    restart: 'no'

  api:
    image: latex-cloud/api:dev
    environment: *app-env
    ports: ['127.0.0.1:${API_PORT:-4000}:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    # Deliberately NO docker.sock mount and NO TeX toolchain in this image.

  # Real-time collaboration (Hocuspocus/Yjs). Persists to Postgres; Redis
  # carries API → collab notifications. No TeX, no Docker socket.
  collab:
    build: { context: ../.., dockerfile: apps/collab/Dockerfile }
    image: latex-cloud/collab:dev
    environment:
      <<: *app-env
      COLLAB_PORT: '4100'
    ports: ['127.0.0.1:${COLLAB_PORT:-4100}:4100']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 15s
    restart: unless-stopped

  # Build-only service: produces the TeX sandbox image the worker runs per compile.
  texlive:
    build: { context: ../tex-images }
    image: latex-cloud/texlive:dev
    entrypoint: ['true']
    restart: 'no'

  # Compile worker. ⚠️ TRUSTED LOCAL USE ONLY: it receives the host Docker socket
  # (root-equivalent) to start one locked-down sandbox container per compile.
  # Never expose this stack to untrusted users (docs/security/compile-sandbox.md).
  compile-worker:
    build: { context: ../.., dockerfile: apps/compile-orchestrator/Dockerfile }
    image: latex-cloud/compile-worker:dev
    environment:
      <<: *app-env
      COMPILE_EXECUTOR: docker
      TEX_IMAGE: latex-cloud/texlive:dev
      COMPILE_CONCURRENCY: '2'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    depends_on:
      texlive: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args: { API_INTERNAL_URL: 'http://api:4000' }
    image: latex-cloud/web:dev
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: ['/app/apps/web/.next/cache']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:
