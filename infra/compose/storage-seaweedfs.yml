# Optional override: use SeaweedFS's S3 gateway instead of MinIO (e.g. when
# quay.io is unreachable). Usage:
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/storage-seaweedfs.yml --env-file .env up --build -d --wait
# Development only: the S3 gateway runs without authentication.
services:
  minio:
    image: chrislusf/seaweedfs:latest
    command:
      [
        'server',
        '-s3',
        '-s3.port=9000',
        '-dir=/data',
        '-master.volumeSizeLimitMB=64',
        '-volume.max=100',
      ]
    ports: !override
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 9000',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
