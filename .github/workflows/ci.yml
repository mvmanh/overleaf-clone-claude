name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  checks:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: API integration tests (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: latex_cloud, POSTGRES_PASSWORD: latex_cloud, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U latex_cloud" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://latex_cloud:latex_cloud@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  compile-fixtures:
    name: Compile fixtures + sandbox isolation (Docker executor)
    runs-on: ubuntu-24.04
    env:
      COMPILE_EXECUTOR: docker
      TEX_IMAGE: latex-cloud/texlive:ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - uses: docker/setup-buildx-action@v3
      - name: Build TeX sandbox image
        uses: docker/build-push-action@v6
        with:
          context: infra/tex-images
          tags: latex-cloud/texlive:ci
          load: true
          cache-from: type=gha,scope=texlive
          cache-to: type=gha,mode=max,scope=texlive
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @latex-cloud/compile-orchestrator test:fixtures
      - name: Fixture timing table
        if: always()
        run: pnpm --filter @latex-cloud/compile-orchestrator fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-fixture-output
          path: tests/compile-fixtures/*/_out/
          retention-days: 7

  e2e:
    name: E2E (Docker Compose stack + Playwright)
    runs-on: ubuntu-24.04
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - name: Start stack
        run: docker compose -f infra/compose/docker-compose.yml --env-file .env up --build -d --wait --wait-timeout 300
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Stack logs
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --env-file .env logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }
