# Optional override: use MinIO instead of SeaweedFS for object storage.
# MinIO no longer publishes free public images; set MINIO_IMAGE to an image you
# can pull (e.g. from your own registry). Usage:
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/storage-minio.yml --env-file .env up --build -d --wait
services:
  storage:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE to a MinIO image you can pull}
    entrypoint: !reset null
    command: ['server', '/data', '--console-address', ':9001']
    environment: !override
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    healthcheck:
      # MinIO images do not ship curl; `mc ready` is the documented probe.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
